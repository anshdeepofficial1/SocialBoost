name: Mobile foundation validation

on:
  push:
    branches: [work/mobile-private-media-foundation]
    paths:
      - '.github/workflows/mobile-foundation-validation.yml'
      - 'backend/**'
      - 'frontend/package.json'
      - 'frontend/src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-media-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify backend workspace isolation and API regressions
        run: python -m pytest backend/tests -q

  repair-frontend-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/mobile-private-media-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile and validate tracked npm lockfile
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
      - name: Commit lockfile fix if required
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized'
          else
            git commit -m 'Repair npm dependency lockfile for clean CI'
            git pull --rebase origin work/mobile-private-media-foundation
            git push origin HEAD:work/mobile-private-media-foundation
          fi
